services:
  server:
    image: fauria/vsftpd
    ports:
      - 2121:21
    environment:
      - "FTP_USER=${FTP_USER:-user}"
      - "FTP_PASS=${FTP_PASS:-pass}"
      - "PASV_ADDRESS=server"
      - "PASV_ADDR_RESOLVE=YES"
    volumes:
      - server-data:/home/vsftpd/
    networks:
      - net
      
  client:
    image: lscr.io/linuxserver/filezilla:latest
    volumes:
      - client-config:/config
      - ./rsc/filezilla/filezilla.xml:/config/.config/filezilla/filezilla.xml:ro
      - ./rsc/filezilla/sitemanager.xml:/config/.config/filezilla/sitemanager.xml:ro
    ports:
      - 3001:3001
    networks:
      - net

  wireshark:
    image: lscr.io/linuxserver/wireshark:latest
    environment:
      - TZ=Europe/Paris
    volumes:
      - wireshark-config:/config
    ports:
      - 3002:3001
    cap_add:
      - NET_ADMIN
    shm_size: "1gb"
    restart: unless-stopped
    profiles: ["tools"]
    networks:
      - net

  inquisitor:
    image: inquisitor
    build:
      context: .
      dockerfile: rsc/docker/Dockerfile
    command: ["./rsc/test.sh"]
    environment:
      - "CLIENT_HOST=${CLIENT_HOST:-client}"
      - "SERVER_HOST=${SERVER_HOST:-server}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.send_redirects=0
    profiles: ["prod"]
    networks:
      - net

  tester:
    image: inquisitor
    command: ["./rsc/ftp_scenario.sh"]
    environment:
      - "SERVER_HOST=${SERVER_HOST:-server}"
      - "FTP_USER=${FTP_USER:-user}"
      - "FTP_PASS=${FTP_PASS:-pass}"
    depends_on:
      - server
    profiles: ["tests"]
    networks:
      - net

volumes:
  server-data:
  client-config:
  wireshark-config:

networks:
  net: